[project]
name = "wamotion-ears"
version = "0.1.0"
description = "Wamotion ears API: earshot kept warm on one machine, called over HTTP by the wamotion skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# earshot itself (torch CPU, transformers, librosa …) is installed by the Dockerfile at the pinned commit;
# the tests run without it.
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wamotion_ears"]

[tool.pytest.ini_options]
testpaths = ["tests"]
